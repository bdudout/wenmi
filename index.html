<link rel="alternate" hreflang="x-default" href="en/index.html">
<link rel="alternate" hreflang="en" href="en/index.html">
<link rel="alternate" hreflang="fr" href="fr/index.html">
<link rel="alternate" hreflang="zh-Hans" href="zh-hans/index.html">
<link rel="alternate" hreflang="zh-Hant" href="zh-hant/index.html">
<link rel="alternate" hreflang="ja" href="ja/index.html">
<script>
  // Choix de la langue : 1) choix déjà fait sur le site, 2) langues du navigateur, 3) anglais par défaut.
  // Ajouter ?choose à l'URL pour afficher le sélecteur sans redirection.
  (function () {
    if (/[?&]choose\b/.test(location.search)) return;
    var OK = { en: 1, fr: 1, 'zh-hans': 1, 'zh-hant': 1, ja: 1 };
    var go = function (l) { location.replace(l + '/index.html'); };
    try { var saved = localStorage.getItem('wenmi-lang'); if (OK[saved]) return go(saved); } catch (e) {}
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i] || '').toLowerCase();
      if (/^zh-(hant|tw|hk|mo)\b/.test(l)) return go('zh-hant');
      if (/^zh\b/.test(l)) return go('zh-hans');
      var base = l.split('-')[0];
      if (base === 'fr' || base === 'ja' || base === 'en') return go(base);
    }
    go('en');
  })();
</script>

  </ul>

<script>
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[data-lang]');
    if (a) { try { localStorage.setItem('wenmi-lang', a.dataset.lang); } catch (e) {} }
  });
</script>
